[package]
name = "auth_service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
argon2 = "^0.5.3"
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
mockall = "0.14.0"
prost = "0.14.3"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.12.3"
rpassword = "7.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "time",
    "uuid",
] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
utoipa = { version = "5.5.0", features = ["uuid", "actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[lib]
name = "auth_service"
path = "src/lib.rs"

[[bin]]
name = "grpc_server"
path = "src/grpc_server.rs"

[[bin]]
name = "http_server"
path = "src/http_server.rs"

[build-dependencies]
tonic-prost-build = "0.14.6"
