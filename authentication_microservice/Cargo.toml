[package]
name = "auth_service"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "^0.5.3"
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls"] }
mockall = "0.14.0"
prost = "0.14.4"
rand = "0.10.1"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1.12.3"
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "time",
    "uuid",
] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.2", features = ["v4", "serde"] }

[lib]
name = "auth_service"
path = "src/lib.rs"

[[bin]]
name = "grpc_server"
path = "src/grpc_server.rs"

[[bin]]
name = "cli"
path = "src/cli.rs"

[build-dependencies]
tonic-prost-build = "0.14.6"
