syntax = "proto3";

package recommendation.v1;

import "google/protobuf/timestamp.proto";

message CPU {
  string id = 1;
  string brand = 2;
  string gen = 3;
  string family = 4;
  string series = 5;
  int32 cores = 6;
  int32 threads = 7;
  float base_clock = 8;
  float max_clock = 9;
  int32 cache = 10;
  string socket = 11;
  bool graphics = 12;
  bool oc = 13;
  int32 recommended_power = 14;
  float avg_price = 15;
  google.protobuf.Timestamp release_date = 16;
  optional bytes img = 17;
  google.protobuf.Timestamp created_at = 18;
  optional google.protobuf.Timestamp updated_at = 19;
}

message GPU {
  string id = 1;
  string brand = 2;
  string family = 3;
  string series = 4;
  int32 memory_amount = 5;
  string memory_gen = 6;
  int32 cores = 7;
  int32 pci_express = 8;
  int32 recommended_power = 9;
  float avg_price = 10;
  google.protobuf.Timestamp release_date = 11;
  optional bytes img = 12;
  google.protobuf.Timestamp created_at = 13;
  optional google.protobuf.Timestamp updated_at = 14;
}

message RAMMemory {
  string id = 1;
  string brand = 2;
  string ddr = 3;
  int32 memory_amount = 4;
  float avg_price = 5;
  int32 frequency_mhz = 6;
  string series = 7;
  optional bytes img = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp updated_at = 10;
}

message MotherBoard {
  string id = 1;
  string brand = 2;
  string series = 3;
  string socket = 4;
  string ddr = 5;
  int32 memory_slots = 6;
  int32 max_ram = 7;
  int32 max_ram_frequency_mhz = 8;
  int32 m2_slots = 9;
  int32 pci_express_x16 = 10;
  int32 vrm = 11;
  float avg_price = 12;
  int32 score = 13;
  optional bytes img = 14;
  google.protobuf.Timestamp created_at = 15;
  optional google.protobuf.Timestamp updated_at = 16;
}

message PowerSource {
  string id = 1;
  string brand = 2;
  string series = 3;
  int32 power_amount = 4;
  string ranking = 5;
  int32 score = 6;
  bool eighty_plus_cert = 7;
  float avg_price = 8;
  optional bytes img = 9;
  google.protobuf.Timestamp created_at = 10;
  optional google.protobuf.Timestamp updated_at = 11;
}

message SSD {
    string id = 1;
    string brand = 2;
    string series = 3;
    int32 amount = 4;
    string type = 5;
    int32 reading = 6;
    int32 writing = 7;
    float avg_price = 8;
    int32 score = 9;
    optional bytes img = 10;
    google.protobuf.Timestamp created_at = 11;
    optional google.protobuf.Timestamp updated_at = 12;
}
