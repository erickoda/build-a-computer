syntax = "proto3";

package recommendation.v1;

import "google/protobuf/timestamp.proto";

message Game {
    string id = 1;
    string name = 2;
    optional bytes img = 3;
    int32 necessary_disk = 4;
    int32 avg_fps = 5;
    google.protobuf.Timestamp created_at = 6;
    optional google.protobuf.Timestamp updated_at = 7;
}
