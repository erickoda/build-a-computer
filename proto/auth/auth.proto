syntax = "proto3";

package auth;

service Auth {
    rpc SignIn(SignInRequest) returns (AuthReply);
    rpc SignUp(SignUpRequest) returns (AuthReply);
}

message SignInRequest {
    string email = 1;
    string password = 2;
}

message SignUpRequest {
    string username = 1;
    string email = 2;
    string password = 3;
}

message AuthReply {
    string token = 1;
}
