[package]
name = "api_gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
prost = "0.14.3"
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
utoipa = { version = "5.5.0", features = ["uuid"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
