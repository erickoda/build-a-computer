syntax = "proto3";

package pkg.protos.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.buildpc.benchmark_service.grpc.generated";
option java_multiple_files = true;
option java_outer_classname = "HardwareProto";

// --- Services ---
service CPUService {
  rpc CreateCPU  (CreateCPURequest)  returns (CPUResponse);
  rpc GetCPU     (GetCPURequest)     returns (CPUResponse);
  rpc ListCPUs   (ListCPURequest)   returns (ListCPUResponse);
  rpc DeleteCPU  (DeleteCPURequest)  returns (DeleteCPUResponse);
}

service GPUService {
  rpc CreateGPU  (CreateGPURequest)  returns (GPUResponse);
  rpc GetGPU     (GetGPURequest)     returns (GPUResponse);
  rpc ListGPUs   (ListGPURequest)   returns (ListGPUResponse);
  rpc DeleteGPU  (DeleteGPURequest)  returns (DeleteGPUResponse);
}

service RAMService {
  rpc CreateRAM  (CreateRAMRequest)  returns (RAMResponse);
  rpc GetRAM     (GetRAMRequest)     returns (RAMResponse);
  rpc ListRAMs   (ListRAMRequest)   returns (ListRAMResponse);
  rpc DeleteRAM  (DeleteRAMRequest)  returns (DeleteRAMResponse);
}

service MotherBoardService {
  rpc CreateMotherBoard  (CreateMotherBoardRequest)  returns (MotherBoardResponse);
  rpc GetMotherBoard     (GetMotherBoardRequest)     returns (MotherBoardResponse);
  rpc ListMotherBoards   (ListMotherBoardRequest)   returns (ListMotherBoardResponse);
  rpc DeleteMotherBoard  (DeleteMotherBoardRequest)  returns (DeleteMotherBoardResponse);
}

service PSUService {
  rpc CreatePSU  (CreatePSURequest)  returns (PSUResponse);
  rpc GetPSU     (GetPSURequest)     returns (PSUResponse);
  rpc ListPSUs   (ListPSURequest)   returns (ListPSUResponse);
  rpc DeletePSU  (DeletePSURequest)  returns (DeletePSUResponse);
}

service SSDService {
  rpc CreateSSD  (CreateSSDRequest)  returns (SSDResponse);
  rpc GetSSD     (GetSSDRequest)     returns (SSDResponse);
  rpc ListSSDs   (ListSSDRequest)   returns (ListSSDResponse);
  rpc DeleteSSD  (DeleteSSDRequest)  returns (DeleteSSDResponse);
}

// --- Request Messages---
message CreateCPURequest {
  string brand = 1;
  string gen = 2;
  string family = 3;
  string series = 4;
  int32 cores = 5;
  int32 threads = 6;
  float base_clock = 7;
  float max_clock = 8;
  int32 cache = 9;
  string socket = 10;
  bool graphics = 11;
  bool oc = 12;
  int32 recommended_power = 13;
  float avg_price = 14;
  google.protobuf.Timestamp release_date = 15;
  optional bytes img = 16;
}
message GetCPURequest {
    string id = 1;
}
message ListCPURequest {

}
message DeleteCPURequest {
    string id = 1;
}

message CreateGPURequest {
  string brand = 1;
  string family = 2;
  string series = 3;
  int32 memory_amount = 4;
  string memory_gen = 5;
  int32 cores = 6;
  int32 pci_express = 7;
  int32 recommended_power = 8;
  float avg_price = 9;
  google.protobuf.Timestamp release_date = 10;
  optional bytes img = 11;
}
message GetGPURequest {
    string id = 1;
}
message ListGPURequest {

}
message DeleteGPURequest {
    string id = 1;
}

message CreateRAMRequest {
  string brand = 1;
  string ddr = 2;
  int32 memory_amount = 3;
  float avg_price = 4;
  int32 frequency_mhz = 5;
  string series = 6;
  optional bytes img = 7;
}
message GetRAMRequest {
    string id = 1;
}
message ListRAMRequest {

}
message DeleteRAMRequest {
    string id = 1;
}

message CreateMotherBoardRequest {
  string brand = 1;
  string series = 2;
  string socket = 3;
  string ddr = 4;
  int32 memory_slots = 5;
  int32 max_ram = 6;
  float max_ram_frequency_mhz = 7;
  int32 m2_slots = 8;
  int32 pci_express_x16 = 9;
  int32 vrm = 10;
  float avg_price = 11;
  int32 score = 12;
  optional bytes img = 13;
}
message GetMotherBoardRequest {
    string id = 1;
}
message ListMotherBoardRequest {

}
message DeleteMotherBoardRequest {
    string id = 1;
}

message CreatePSURequest {
  string brand = 1;
  string series = 2;
  int32 power_amount = 3;
  string ranking = 4;
  int32 score = 5;
  bool eighty_plus_cert = 6;
  float avg_price = 7;
  optional bytes img = 8;
}
message GetPSURequest {
    string id = 1;
}
message ListPSURequest {

}
message DeletePSURequest {
    string id = 1;
}

message CreateSSDRequest {
  string brand = 1;
  string series = 2;
  int32 amount = 3;
  string type = 4;
  int32 reading = 5;
  int32 writing = 6;
  float avg_price = 7;
  int32 score = 8;
  optional bytes img = 9;
}
message GetSSDRequest {
    string id = 1;
}
message ListSSDRequest {

}
message DeleteSSDRequest {
    string id = 1;
}


// --- Response Messages---
message CPUResponse {
  string id = 1;
  string brand = 2;
  string gen = 3;
  string family = 4;
  string series = 5;
  int32 cores = 6;
  int32 threads = 7;
  float base_clock = 8;
  float max_clock = 9;
  int32 cache = 10;
  string socket = 11;
  bool graphics = 12;
  bool oc = 13;
  int32 recommended_power = 14;
  float avg_price = 15;
  google.protobuf.Timestamp release_date = 16;
  optional bytes img = 17;
  google.protobuf.Timestamp created_at = 18;
  optional google.protobuf.Timestamp updated_at = 19;
}
message ListCPUResponse {
  repeated CPUResponse cpu = 1;
}
message DeleteCPUResponse {
    bool success = 1;
}

message GPUResponse {
  string id = 1;
  string brand = 2;
  string family = 3;
  string series = 4;
  int32 memory_amount = 5;
  string memory_gen = 6;
  int32 cores = 7;
  int32 pci_express = 8;
  int32 recommended_power = 9;
  float avg_price = 10;
  google.protobuf.Timestamp release_date = 11;
  optional bytes img = 12;
  google.protobuf.Timestamp created_at = 13;
  optional google.protobuf.Timestamp updated_at = 14;
}
message ListGPUResponse {
  repeated GPUResponse gpu = 1;
}
message DeleteGPUResponse {
    bool success = 1;
}

message RAMResponse {
  string id = 1;
  string brand = 2;
  string ddr = 3;
  int32 memory_amount = 4;
  float avg_price = 5;
  int32 frequency_mhz = 6;
  string series = 7;
  optional bytes img = 8;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp updated_at = 10;
}
message ListRAMResponse {
  repeated RAMResponse ram = 1;
}
message DeleteRAMResponse {
    bool success = 1;
}

message MotherBoardResponse {
  string id = 1;
  string brand = 2;
  string series = 3;
  string socket = 4;
  string ddr = 5;
  int32 memory_slots = 6;
  int32 max_ram = 7;
  float max_ram_frequency_mhz = 8;
  int32 m2_slots = 9;
  int32 pci_express_x16 = 10;
  int32 vrm = 11;
  float avg_price = 12;
  int32 score = 13;
  optional bytes img = 14;
  google.protobuf.Timestamp created_at = 15;
  optional google.protobuf.Timestamp updated_at = 16;
}
message ListMotherBoardResponse {
  repeated MotherBoardResponse motherboard = 1;
}
message DeleteMotherBoardResponse {
    bool success = 1;
}

message PSUResponse {
  string id = 1;
  string brand = 2;
  string series = 3;
  int32 power_amount = 4;
  string ranking = 5;
  int32 score = 6;
  bool eighty_plus_cert = 7;
  float avg_price = 8;
  optional bytes img = 9;
  google.protobuf.Timestamp created_at = 10;
  optional google.protobuf.Timestamp updated_at = 11;
}
message ListPSUResponse {
  repeated PSUResponse psu = 1;
}
message DeletePSUResponse {
    bool success = 1;
}

message SSDResponse {
    string id = 1;
    string brand = 2;
    string series = 3;
    int32 amount = 4;
    string type = 5;
    int32 reading = 6;
    int32 writing = 7;
    float avg_price = 8;
    int32 score = 9;
    optional bytes img = 10;
    google.protobuf.Timestamp created_at = 11;
    optional google.protobuf.Timestamp updated_at = 12;
}
message ListSSDResponse {
  repeated SSDResponse ssd = 1;
}
message DeleteSSDResponse {
    bool success = 1;
}