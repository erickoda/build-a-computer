services:
  builder-grpc:
    container_name: pc_builder_service
    build:
      context: .
      dockerfile: Dockerfile
      target: run-stage
    env_file:
      - .env
    environment:
      - ADDR:${ADDR}
      - PGHOST:postgres
      - PGUSER:${PGUSER}
      - PGPASSWORD:${PGPASSWORD}
      - PGDATABASE:${PGDATABASE}
      - PGSSLMODE:${PGSSLMODE}
    ports:
      - "${PORT}:50051"
    networks:
      - grpc-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051", "-service=builder.BuilderService"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    
  postgres:
     container_name: benchmarkDB
     image: postgres:18.4-alpine3.23
     env_file:
       - .env
     environment: 
       - POSTGRES_USER=${POSTGRES_USER}
       - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
       - POSTGRES_DB=${POSTGRES_DB}
       - PGDATA=/data/postgres
     ports:
         - "5432:5432"
     networks:
       - grpc-service
     extra_hosts:
       - "host.docker.internal:host-gateway"
     restart: unless-stopped
     healthcheck:
       test: ["CMD-SHELL", "pg_isready"]
       interval: 30s
       timeout: 10s
       retries: 5
     volumes:
       - pgdata:/var/lib/postgresql/data

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    restart: unless-stopped
    networks:
      - grpc-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

networks:
  grpc-service:
    driver: bridge

volumes:
  pgdata: