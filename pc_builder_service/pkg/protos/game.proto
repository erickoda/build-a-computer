syntax = "proto3";

package builder;

option go_package = "github.com/erickoda/build-a-computer/pc_builder_service/pkg/protos";

import "google/protobuf/timestamp.proto";

message Game {
    string id = 1;
    string name = 2;
    optional bytes img = 3;
    google.protobuf.Timestamp created_at = 4;
}