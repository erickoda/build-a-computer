services:
  api_gateway:
    build:
      context: ./api_gateway
      additional_contexts:
        protos: ./proto
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 128M
    ports:
      - ${API_GATEWAY_PORT}:${API_GATEWAY_PORT}
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_MICROSERVICE_URL=${AUTH_MICROSERVICE_URL}
      - USERS_MICROSERVICE_URL=${USERS_MICROSERVICE_URL}
    depends_on:
      authentication_microservice:
        condition: service_healthy

  authentication_microservice:
    build:
      context: ./auth_service
      additional_contexts:
        protos: ./proto
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 128M
    ports:
      - ${AUTH_MICROSERVICE_PORT}:${AUTH_MICROSERVICE_PORT}
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${AUTH_MICROSERVICE_JWT_EXPIRATION}
      - DATABASE_URL=${AUTH_MICROSERVICE_USERS_DATABASE_URL}
      - SMTP_USERNAME=${AUTH_MICROSERVICE_SMTP_USERNAME}
      - SMTP_PASSWORD=${AUTH_MICROSERVICE_SMTP_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/${AUTH_MICROSERVICE_PORT}'"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      users_db:
        condition: service_healthy

  users_db:
    image: postgres:15-alpine
    ports:
      - ${USERS_DB_PORT}:${USERS_DB_PORT}
    environment:
      POSTGRES_USER: ${USERS_DB_POSTGRES_USER}
      POSTGRES_PASSWORD: ${USERS_DB_POSTGRES_PASSWORD}
      POSTGRES_DB: ${USERS_DB_POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${USERS_DB_POSTGRES_USER} -d $${USERS_DB_POSTGRES_DB}"] 
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
